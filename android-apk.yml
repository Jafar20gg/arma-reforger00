name: Build Android APK

# Run it by hand: GitHub > Actions > Build Android APK > Run workflow.
# Result: an installable APK under the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    tags:
      - 'apk-*'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # v4: the old "tools" package is no longer requested (that was what failed on v3).
      # packages is left empty because the GitHub runner already has the SDK; this only accepts licenses.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install dependencies
        run: npm install

      - name: Build the web app
        run: npm run build

      - name: Create the Android project (first run only)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Copy the web build into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AR-FCS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
